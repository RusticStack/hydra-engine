[workspace]
resolver = "3"
members = ["crates/hydra-native", "crates/hydra-trace"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
libc = "0.2.191"
windows-sys = "0.61.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
crc32fast = "1"
memmap2 = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
