# Standalone until the HydraNative workspace (rust/p1-native-core) lands: then add
# "crates/hydra-snapshot" to its members and delete the [workspace] table below.
[package]
name = "hydra-snapshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Reader for Hydra sealed-generation program snapshots (HYSNAP01): lock-free bulk byte reads over a memory map, with a C ABI"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
memmap2 = "0.9.10"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace]
