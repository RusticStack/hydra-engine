apply from: "$rootProject.projectDir/gradle/distributableGhidraModule.gradle"
apply plugin: 'eclipse'

eclipse.project.name = 'Framework HydraNative'

/*****************************************************************************************
 * hydra_native: the Rust library (crates/hydra-native, a cdylib with a C ABI) that Java calls
 * through the foreign function API (ghidra.util.HydraCpu in module Utility).
 *
 * cargoBuild builds it with the toolchain pinned in rust-toolchain.toml and the dependencies
 * pinned in Cargo.lock (--locked); buildNatives puts the library where Ghidra's natives go
 * (build/os/<platform>, shipped as os/<platform>). Cargo is found on the PATH, or set CARGO.
 *****************************************************************************************/
def platform = rootProject.getCurrentPlatformName()
def cargoDir = file('build/cargo')
def library = System.mapLibraryName('hydra_native')

task cargoBuild(type: Exec) {
	group = 'Hydra'
	description = 'Builds hydra_native with cargo (release). [Ghidra/Framework/HydraNative/build.gradle]'
	workingDir projectDir
	executable System.getenv('CARGO') ?: 'cargo'
	args 'build', '--release', '--locked'
	environment 'CARGO_TARGET_DIR', cargoDir.path
	inputs.files(fileTree(projectDir) {
		include 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/**'
		exclude '**/build/**'
	})
	outputs.file "${cargoDir}/release/${library}"
}

task "buildNatives_${platform}"(type: Copy) {
	group = 'Hydra'
	description = "Copies hydra_native to build/os/${platform}. [Ghidra/Framework/HydraNative/build.gradle]"
	from cargoBuild
	into "build/os/${platform}"
}

task buildNatives {
	group = 'Hydra'
	description = 'Builds hydra_native for the current platform. [Ghidra/Framework/HydraNative/build.gradle]'
	dependsOn "buildNatives_${platform}"
}

// The install's os/<platform> is copied from build/os/<platform> (distributableGhidraModule.gradle)
rootProject.tasks.named("assembleDistribution_${platform}") {
	dependsOn buildNatives
}
