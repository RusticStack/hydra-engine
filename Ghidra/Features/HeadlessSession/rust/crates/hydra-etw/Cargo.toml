[package]
name = "hydra-etw"
description = "Real-time ETW consumer for the Hydra semantic trace: kernel process, thread, image, file, registry, network and PnP events of one process tree, written as a TRACE-1 raw segment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hydra-etw"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
crc32fast = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_Performance"] }

[lints]
workspace = true
