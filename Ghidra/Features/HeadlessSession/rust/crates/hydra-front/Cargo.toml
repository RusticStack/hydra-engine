[package]
name = "hydra-front"
description = "Front door of the Hydra Engine daemon: terminates client connections, answers what it can natively and starts the JVM backend lazily for the rest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hydra-front"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true
