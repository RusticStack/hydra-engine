[package]
name = "hydra-lite"
description = "JVM-free read-only Hydra Engine daemon: answers the subset of protocol 3 that the Rust Program database reader can reproduce exactly, and refuses everything else with use_full_daemon (see HYDRA-LITE.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hydra_lite"
path = "src/lib.rs"

[[bin]]
name = "hydra-lite"
path = "src/main.rs"

[dependencies]
ghidra-progdb = { path = "../../../../../Framework/HydraFormats/crates/ghidra-progdb" }
ghidra-fmt-gbf = { path = "../../../../../Framework/HydraFormats/crates/ghidra-fmt-gbf" }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true
