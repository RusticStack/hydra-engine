# Rust client for the Hydra Engine session protocol (PROTOCOL 2 and 3), and the read-only
# agent host built on it. Kept in the HeadlessSession feature because it is a client of that
# feature's protocol; it is not part of the HydraNative workspace (that one builds the JNI
# library) and it touches none of its crates.
#
# Why a Rust client: the shipped Python client is 18-21 MB private per agent (CPython's floor
# is 8.5 MB); a Rust agent is 2-4 MB and has no interpreter start-up. The Python client stays
# the default until this one is proven reply-identical (see PORTING.md and the lane report).
[workspace]
resolver = "3"
members = ["crates/hydra-client", "crates/hydra-agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

# The BeautifulRust drop-in lints (C:/dev-overflow/tools/BeautifulRust/lints/lints.toml),
# with the library-only ones kept in the library crate.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
exhaustive_enums = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
