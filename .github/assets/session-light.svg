<text x="430.0" y="20" text-anchor="middle" fill="#6e7781">python  ·  Hydra Engine daemon</text>
<text class="l l0" x="18" y="54"><tspan fill="#15803d">&gt;&gt;&gt; </tspan><tspan fill="#1f2328">import ghidra_session as gs</tspan></text>
<text class="l l0" x="842" y="54" text-anchor="end" fill="#6e7781"># 2.2 ms</text>
<text class="l l1" x="18" y="72"><tspan fill="#15803d">&gt;&gt;&gt; </tspan><tspan fill="#1f2328">s = gs.connect(client=&#x27;demo&#x27;, harness=&#x27;readme&#x27;)</tspan></text>
<text class="l l1" x="842" y="72" text-anchor="end" fill="#6e7781"># 643 ms</text>
<text class="l l2" x="18" y="90"><tspan fill="#15803d">&gt;&gt;&gt; </tspan><tspan fill="#1f2328">s.call(&#x27;open_project&#x27;, path=&#x27;demo.gpr&#x27;, writable=True)[&#x27;id&#x27;]</tspan></text>
<text class="l l2" x="842" y="90" text-anchor="end" fill="#6e7781"># 145 ms</text>
<text class="l l3" x="18" y="108" fill="#1f2328">&#x27;p1&#x27;</text>
<text class="l l4" x="18" y="126"><tspan fill="#15803d">&gt;&gt;&gt; </tspan><tspan fill="#1f2328">s.call(&#x27;import&#x27;, file=&#x27;hydra_demo.exe&#x27;, analyze=True)[&#x27;imported&#x27;]</tspan></text>
<text class="l l4" x="842" y="126" text-anchor="end" fill="#6e7781"># 15,523 ms</text>
<text class="l l5" x="18" y="144" fill="#1f2328">True</text>
<text class="l l6" x="18" y="162"><tspan fill="#15803d">&gt;&gt;&gt; </tspan><tspan fill="#1f2328">s.call(&#x27;import&#x27;, file=&#x27;hydra_demo.exe&#x27;)[&#x27;imported&#x27;]   # same SHA-256: never twice</tspan></text>
<text class="l l6" x="842" y="162" text-anchor="end" fill="#6e7781"># 4.2 ms</text>
<text class="l l7" x="18" y="180" fill="#1f2328">False</text>
<text class="l l8" x="18" y="198"><tspan fill="#15803d">&gt;&gt;&gt; </tspan><tspan fill="#1f2328">{k: s.call(&#x27;info&#x27;)[k] for k in (&#x27;format&#x27;, &#x27;language&#x27;, &#x27;functions&#x27;)}</tspan></text>
<text class="l l8" x="842" y="198" text-anchor="end" fill="#6e7781"># 2.0 ms</text>
<text class="l l9" x="18" y="216" fill="#1f2328">{&#x27;format&#x27;: &#x27;Portable Executable (PE)&#x27;, &#x27;language&#x27;: &#x27;x86:LE:64:default&#x27;, &#x27;functions&#x27;: 574}</text>
<text class="l l10" x="18" y="234"><tspan fill="#15803d">&gt;&gt;&gt; </tspan><tspan fill="#1f2328">print(s.call(&#x27;decompile&#x27;, name=&#x27;grow_heads&#x27;)[&#x27;c&#x27;])</tspan></text>
<text class="l l10" x="842" y="234" text-anchor="end" fill="#6e7781"># 248 ms</text>
<text class="l l11" x="18" y="252" fill="#1f2328"></text>
<text class="l l12" x="18" y="270" fill="#1f2328">int __cdecl grow_heads(int param_1,int param_2)</text>
<text class="l l13" x="18" y="288" fill="#1f2328"></text>
<text class="l l14" x="18" y="306" fill="#1f2328">{</text>
<text class="l l15" x="18" y="324" fill="#1f2328">  int iVar1;</text>
<text class="l l16" x="18" y="342" fill="#1f2328">  </text>
<text class="l l17" x="18" y="360" fill="#1f2328">  iVar1 = 0;</text>
<text class="l l18" x="18" y="378" fill="#1f2328">  if (0 &lt; param_2) {</text>
<text class="l l19" x="18" y="396" fill="#1f2328">    do {</text>
<text class="l l20" x="18" y="414" fill="#1f2328">      if (param_1 == 0) {</text>
<text class="l l21" x="18" y="432" fill="#1f2328">        return 0;</text>
<text class="l l22" x="18" y="450" fill="#1f2328">      }</text>
<text class="l l23" x="18" y="468" fill="#1f2328">      param_1 = param_1 + 1;</text>
<text class="l l24" x="18" y="486" fill="#1f2328">      iVar1 = iVar1 + 1;</text>
<text class="l l25" x="18" y="504" fill="#1f2328">    } while (iVar1 &lt; param_2);</text>
<text class="l l26" x="18" y="522" fill="#1f2328">  }</text>
<text class="l l27" x="18" y="540" fill="#1f2328">  return param_1;</text>
<text class="l l28" x="18" y="558" fill="#1f2328">}</text>
<text class="l l29" x="18" y="576" fill="#1f2328"></text>
<text class="l l30" x="18" y="594"><tspan fill="#15803d">&gt;&gt;&gt; </tspan><tspan fill="#1f2328">s.call(&#x27;decompile&#x27;, name=&#x27;grow_heads&#x27;)[&#x27;signature&#x27;]</tspan></text>
<text class="l l30" x="842" y="594" text-anchor="end" fill="#6e7781"># 3.0 ms</text>
