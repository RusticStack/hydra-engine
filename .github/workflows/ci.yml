name: CI

# The default build is headless (gradle buildHeadless): no window modules, help or javadoc.
# The full Ghidra build with the window (gradle buildGhidra) runs weekly and on demand.

# Pushes to main and pull requests only: a pushed work branch is tested by its pull request, not twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the full Ghidra build (buildGhidra)'
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'   # Mondays: the full build too

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  headless:
    name: headless build + session tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      GHIDRA_INSTALL: ${{ github.workspace }}/build/dist/headless
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The long suites ran locally (D:/Projects/Hydra/_logs, run_parallel on 22 cores) on the commit named in
      # .github/local-test-record.json. They (daemon_tests, contract_tests) are skipped here when every change from that commit to this one is a
      # document (*.md), a workflow file (.github/) or the record itself; any other change runs them on the runner as before.
      # The build, the smoke test and the client packaging always run.
      - name: Check the local test record
        run: |
          rec=.github/local-test-record.json
          skip=false
          if [ -f "$rec" ]; then
            tested=$(python -c "import json; print(json.load(open('$rec'))['testedCommit'])")
            if git merge-base --is-ancestor "$tested" HEAD; then
              other=$(git diff --name-only "$tested" HEAD | grep -v -E '\.md$|^\.github/' | grep -v -x "$rec" || true)
              if [ -z "$other" ]; then skip=true; else echo "changed since $tested, beyond documents:"; echo "$other"; fi
            else
              echo "::warning::$tested in $rec is not an ancestor of this commit"
            fi
          fi
          echo "LOCAL_TESTED=$skip" >> "$GITHUB_ENV"
          echo "Long suites covered by the local record: $skip" >> "$GITHUB_STEP_SUMMARY"
          [ -f "$rec" ] && cat "$rec" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Read the JDK version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties | tr -d '\r')" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VER }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache fetched dependencies
        uses: actions/cache@v5
        with:
          path: dependencies
          key: deps-${{ runner.os }}-${{ hashFiles('gradle/support/fetchDependencies.gradle') }}

      # PowerShell runs gradlew.bat (Ghidra's POSIX gradlew does not find its wrapper under Git Bash)
      - name: Fetch dependencies
        shell: pwsh
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build the headless install
        shell: pwsh
        run: ./gradlew buildHeadless --parallel "-PheadlessInstallDir=$env:GHIDRA_INSTALL"

      - name: Install summary
        run: |
          python - <<'EOF'
          import os, pathlib
          root = pathlib.Path(os.environ["GHIDRA_INSTALL"])
          files = [p for p in root.rglob("*") if p.is_file()]
          jars = [p for p in files if p.suffix == ".jar" and "/lib/" in p.as_posix()]
          print(f"{len(files)} files, {sum(p.stat().st_size for p in files) / 2**20:.1f} MiB, {len(jars)} module jars")
          EOF

      - name: Pick test binaries
        run: |
          echo "BIN_A=C:/Windows/System32/choice.exe" >> "$GITHUB_ENV"
          echo "BIN_B=C:/Windows/System32/whoami.exe" >> "$GITHUB_ENV"
          echo "BIN_DLL=C:/Windows/System32/version.dll" >> "$GITHUB_ENV"

      - name: session_smoke.py
        run: >
          python Ghidra/Features/HeadlessSession/examples/session_smoke.py
          --ghidra "$GHIDRA_INSTALL" --work "$RUNNER_TEMP/smoke"
          --binary "$BIN_A" --binary "$BIN_B"

      - name: daemon_tests.py
        if: env.LOCAL_TESTED != 'true'
        run: >
          python Ghidra/Features/HeadlessSession/examples/daemon_tests.py
          --ghidra "$GHIDRA_INSTALL" --work "$RUNNER_TEMP/daemon"
          --exe "$BIN_A" --dll "$BIN_DLL"

      - name: contract_tests.py
        if: env.LOCAL_TESTED != 'true'
        run: >
          python Ghidra/Features/HeadlessSession/examples/contract_tests.py
          --ghidra "$GHIDRA_INSTALL" --work "$RUNNER_TEMP/contract"

      - name: Package the client (dry run)
        run: .github/scripts/package-client.sh 12.3-hydra.ci "$RUNNER_TEMP/client"

      - name: Upload the daemon logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: session-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/smoke/**/*.log
            ${{ runner.temp }}/daemon/**/*.log
            ${{ runner.temp }}/contract/**/*.log
          if-no-files-found: ignore

  full:
    name: full Ghidra build (buildGhidra)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Read the JDK version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VER }}

      - name: Fetch dependencies
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Ghidra
        run: ./gradlew buildGhidra --parallel
