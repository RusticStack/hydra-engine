name: Release

# Builds the headless install on Windows, tests it unzipped, and publishes a GitHub Release with
# the zip, SHA256SUMS and the release's CHANGELOG.md section.
#
#   git tag v12.3-hydra.1 && git push origin v12.3-hydra.1               # publishes
#   gh workflow run release.yml --ref <branch> -f version=12.3-hydra.1   # dry run: builds and
#                                                                       # tests, publishes nothing
#
# Versions are <Ghidra version>-hydra.<n>, where the Ghidra version is application.version in
# Ghidra/application.properties. See .github/CONTRIBUTING.md, "Releases".
#
# Windows only, as CI. Linux (ubuntu-latest) and macOS (macos-latest, arm64) built and passed
# both test suites in a dry run on 2026-10-26 (with Windows PE files as test inputs), but are not
# released or tested routinely.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the dry run (file names and the CHANGELOG section); empty: <Ghidra version>-hydra.dev'
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: version and notes check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Work out the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          ghidra=$(awk -F'=' '$1=="application.version" {print $2}' Ghidra/application.properties | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="${INPUT_VERSION:-$ghidra-hydra.dev}"
            publish=false
          fi
          case "$version" in
            "$ghidra"-hydra.*) ;;
            *) echo "::error::version $version does not start with the Ghidra version $ghidra-hydra."; exit 1 ;;
          esac
          if [ "$publish" = true ] && ! grep -q "^## $version\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version (Ghidra $ghidra), publish: $publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build + test (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win_x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASSET: hydra-engine-${{ needs.version.outputs.version }}-${{ matrix.platform }}.zip
      BIN_A: C:/Windows/System32/choice.exe
      BIN_B: C:/Windows/System32/whoami.exe
      BIN_DLL: C:/Windows/System32/version.dll
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read the JDK version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties | tr -d '\r')" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VER }}

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Cache fetched dependencies
        uses: actions/cache@v6.1.0
        with:
          path: dependencies
          key: deps-${{ runner.os }}-${{ hashFiles('gradle/support/fetchDependencies.gradle') }}

      # PowerShell runs gradlew.bat (Ghidra's POSIX gradlew does not find its wrapper under Git Bash)
      - name: Fetch dependencies
        shell: pwsh
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      # The engine reports this as hello's hydraVersion (hydra.properties is empty in the tree)
      - name: Stamp the release version
        run: echo "hydra.version=$VERSION" > Ghidra/Features/HeadlessSession/src/main/resources/hydra.properties

      - name: Build the headless zip
        shell: pwsh
        run: ./gradlew zipHeadless --parallel

      - name: Name the zip
        run: |
          zips=(build/dist/*_headless.zip)
          if [ ${#zips[@]} -ne 1 ] || [ ! -f "${zips[0]}" ]; then
            echo "::error::expected one *_headless.zip in build/dist: ${zips[*]}"; exit 1
          fi
          mkdir -p out
          mv "${zips[0]}" "out/$ASSET"
          ls -l out

      # Test what ships: the zip, unzipped
      - name: Unzip
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'install'
          Expand-Archive -LiteralPath "out/$env:ASSET" -DestinationPath $dest
          $top = @(Get-ChildItem -Directory $dest)
          if ($top.Count -ne 1) { throw "expected one top folder in the zip, found $($top.Count)" }
          foreach ($notice in 'LICENSE', 'NOTICE', 'NOTICE-HYDRA') {
            if (-not (Test-Path -LiteralPath (Join-Path $top[0].FullName $notice))) { throw "the zip has no $notice" }
          }
          "GHIDRA_INSTALL=$($top[0].FullName)" >> $env:GITHUB_ENV
          Write-Output "Install: $($top[0].FullName)"

      - name: session_smoke.py
        run: >
          python Ghidra/Features/HeadlessSession/examples/session_smoke.py
          --ghidra "$GHIDRA_INSTALL" --work "$RUNNER_TEMP/smoke"
          --binary "$BIN_A" --binary "$BIN_B"

      - name: daemon_tests.py
        run: >
          python Ghidra/Features/HeadlessSession/examples/daemon_tests.py
          --ghidra "$GHIDRA_INSTALL" --work "$RUNNER_TEMP/daemon"
          --exe "$BIN_A" --dll "$BIN_DLL"

      - name: contract_tests.py
        run: >
          python Ghidra/Features/HeadlessSession/examples/contract_tests.py
          --ghidra "$GHIDRA_INSTALL" --work "$RUNNER_TEMP/contract"

      - name: Record the result
        run: |
          os_name=$(python -c "import platform; print(platform.platform(terse=True))")
          java_ver=$(java -version 2>&1 | head -n 1)
          size=$(python -c "import os; print(f'{os.path.getsize(\"out/$ASSET\") / 2**20:.0f} MiB')")
          echo "| \`$ASSET\` | $size | ${{ matrix.os }} ($os_name, $java_ver) | built; session_smoke.py, daemon_tests.py and contract_tests.py passed on the unzipped install |" > "out/$ASSET.row"
          cat "out/$ASSET.row" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: zip-${{ matrix.platform }}
          path: out/
          retention-days: 7
          compression-level: 0

      - name: Upload the daemon logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: session-logs-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/smoke/**/*.log
            ${{ runner.temp }}/daemon/**/*.log
            ${{ runner.temp }}/contract/**/*.log
          if-no-files-found: ignore

  release:
    name: publish
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: zip-*
          path: dist
          merge-multiple: true

      # The Python client as its own versioned file, so an integrator pins it with the engine
      - name: Package the client
        run: .github/scripts/package-client.sh "$VERSION" dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum hydra-engine-*.zip hydra-client-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          # The CHANGELOG section of this version, or, for a dry run without one, the first section
          # that is not Unreleased
          section=$(awk -v h="## $VERSION" '$0==h {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md)
          if [ -z "$section" ]; then
            [ "$PUBLISH" = true ] && { echo "::error::no CHANGELOG section for $VERSION"; exit 1; }
            section=$(awk '/^## / {if (on) exit; if ($0 != "## Unreleased") on=1; next} on {print}' CHANGELOG.md)
          fi
          # The upstream commit the section names must be in this release's history
          base=$(printf '%s\n' "$section" | grep -oE 'commit `[0-9a-f]{40}`' | head -n 1 | grep -oE '[0-9a-f]{40}' || true)
          if [ -z "$base" ]; then
            echo "::error::the CHANGELOG section must name the upstream Ghidra commit as: commit \`<40-hex sha>\`"; exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$GITHUB_SHA" --jq .status)
          case "$status" in
            ahead|identical) ;;
            *) echo "::error::upstream commit $base is not in the history of $GITHUB_SHA ($status)"; exit 1 ;;
          esac
          {
            printf '%s\n' "$section"
            echo
            echo "### Download and testing"
            echo
            echo "Built by the [release workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from \`$GITHUB_SHA\`, then unzipped and tested there."
            echo
            echo "| File | Size | Built and tested on | Result |"
            echo "|---|---|---|---|"
            cat dist/*.row
            echo
            echo "SHA-256 (also in \`SHA256SUMS\`):"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: env.PUBLISH == 'true'
        run: >
          gh release create "$GITHUB_REF_NAME" dist/hydra-engine-*.zip dist/hydra-client-*.zip dist/SHA256SUMS
          --verify-tag --title "Hydra Engine $VERSION" --notes-file notes.md

      - name: Dry run (nothing published)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-dry-run-notes
          path: |
            notes.md
            dist/SHA256SUMS
            dist/hydra-client-*.zip
          retention-days: 7
