name: Showcase a project
description: Something you built with Hydra Engine or RusticRE, for the website's showcase.
title: "Showcase: "
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        Projects on the [showcase](https://hydra-engine-site.vercel.app/examples) come from these issues.
        Only programs you own, and no code or assets from them in your repository.
  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link
      description: "A page people can open: repository, release, write-up or video."
      placeholder: https://github.com/you/project
    validations:
      required: true
  - type: input
    id: from
    attributes:
      label: What you reverse-engineered
      placeholder: minecraft-26.3.jar, a scanner's driver DLL, a router's firmware
    validations:
      required: true
  - type: input
    id: to
    attributes:
      label: What it became
      placeholder: A Rust rewrite, a Linux driver, a mod loader
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [game, tool, driver, firmware, mod, research]
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: In a sentence or two
      description: Shown on the card, in your words.
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Harnesses and tools you used
      placeholder: Claude Code, RusticRE, Hydra Engine
  - type: input
    id: author
    attributes:
      label: Credit as
      description: Your name or handle on the card.
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Before you submit
      options:
        - label: The program is one I own, and my project contains no code or assets from it.
          required: true
