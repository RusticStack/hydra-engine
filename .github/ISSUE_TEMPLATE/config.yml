blank_issues_enabled: false
contact_links:
  - name: Showcase a project you built
    url: https://github.com/RusticStack/showcase/issues/new?template=project.yml
    about: Projects made with Hydra Engine or RusticRE go to the showcase repository.
  - name: Documentation
    url: https://hydra-engine-site.vercel.app/docs/quick-start
    about: How to install, connect and use Hydra Engine; many questions are answered there.
  - name: Report a security vulnerability
    url: https://github.com/RusticStack/hydra-engine/security/advisories/new
    about: Report security problems privately, never in a public issue.
  - name: A problem in Ghidra itself
    url: https://github.com/NationalSecurityAgency/ghidra/issues
    about: If it also happens with upstream Ghidra, it belongs to the Ghidra project.
