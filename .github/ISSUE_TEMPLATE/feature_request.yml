name: Feature request
description: Propose a command, option or behaviour for the session daemon or the build.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you are trying to do
      description: "The task, from the client's side: what an agent, tool or script needs to get done, and where the current commands fall short."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: A new command, a field on an existing one, a launcher option, a build change. For a protocol change, sketch the request and the response.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you can do today
      description: "The workaround, if there is one: a GhidraScript through `script`, several calls, a separate `analyzeHeadless` run."
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Upstream Ghidra issues or APIs that matter, numbers you measured, links.
